<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>WAF Detector</title>
    <style>
      :root {
        --ok: #15803d;
        --warn: #b45309;
        --muted: #666;
        --muted-strong: #444;
      }

      body {
        font-family: Arial, sans-serif;
        width: 300px;
        padding: 10px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 200px;
      }

      .title {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status {
        font-size: 16px;
        margin-top: 4px;
      }

      #results {
        list-style: none;
        padding: 0;
        margin: 10px 0 0;
        width: 100%;
        text-align: left;
      }

      .result {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        border-top: 1px solid #eee;
      }

      .badge {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #1e3a8a;
        color: #fff;
        font-weight: bold;
      }

      .result-text {
        min-width: 0;
      }

      .category {
        font-size: 11px;
        color: var(--muted);
      }

      .header-info {
        display: block;
        font-size: 11px;
        color: #555;
        word-break: break-all;
      }

      .note,
      .meta {
        font-size: 11px;
        color: var(--muted);
        margin-top: 8px;
        word-break: break-word;
      }

      button {
        margin-top: 10px;
        padding: 6px 10px;
        font-size: 14px;
        cursor: pointer;
        background-color: #f0f0f0;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button:hover {
        background-color: #e0e0e0;
      }

      button.primary {
        background-color: #1e40af;
        border-color: #1e40af;
        color: #fff;
      }

      button.primary:hover {
        background-color: #1e3a8a;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h3 class="title"><img src="icons/icon32.png" alt="" width="24" height="24" />WAF Detector</h3>
    <div class="status" id="status" role="status" aria-live="polite">Checking...</div>
    <ul id="results"></ul>
    <div class="note" id="note" hidden>
      Not finding a signature doesn't mean the site is unprotected — many WAFs hide or strip
      their headers.
    </div>
    <div class="meta" id="meta"></div>
    <button id="allowBtn" class="primary" hidden>Allow &amp; check</button>
    <button id="retestBtn">🔄 Retest</button>

    <script src="popup.js"></script>
  </body>
</html>
