<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WAF Detector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="icons/icon32.png" alt="" width="22" height="22" />
        <span>WAF Detector</span>
      </div>
      <button id="retestBtn" class="icon-btn" type="button" aria-label="Run the check again" title="Run again">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </header>

    <div class="target" id="target" hidden>
      <span class="target-dot" aria-hidden="true"></span>
      <span class="target-label">Target</span>
      <span class="target-host mono" id="targetHost"></span>
    </div>

    <main id="view" role="status" aria-live="polite"></main>

    <footer class="foot" id="foot" hidden>
      <span class="meta mono" id="meta"></span>
      <button id="copyBtn" class="ghost-btn" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <rect x="9" y="9" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M5 15V6a2 2 0 0 1 2-2h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <span id="copyLabel">Copy report</span>
      </button>
    </footer>

    <!-- ===== View templates ===== -->

    <template id="tpl-scanning">
      <section class="state state-scan">
        <div class="scanner" aria-hidden="true">
          <svg viewBox="0 0 64 72" class="scanner-shield">
            <path d="M32 3 L58 12 V33 C58 50 47 62 32 69 C17 62 6 50 6 33 V12 Z" />
          </svg>
          <span class="scanner-line"></span>
        </div>
        <h1 class="state-title">Inspecting headers…</h1>
        <p class="state-text">Sending one request to the site, without cookies.</p>
      </section>
    </template>

    <template id="tpl-permission">
      <section class="state">
        <div class="state-icon icon-accent" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26">
            <rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </div>
        <h1 class="state-title">Allow access to this site?</h1>
        <p class="state-text">
          WAF Detector needs to read this site's response headers. Nothing is collected or sent
          anywhere else.
        </p>
        <button class="primary-btn" type="button" data-action="allow">Allow &amp; check</button>
        <p class="fineprint">Access is for this site only. You can revoke it in chrome://extensions.</p>
      </section>
    </template>

    <template id="tpl-results">
      <section class="results">
        <div class="summary">
          <span class="summary-count" data-slot="count"></span>
          <div>
            <div class="summary-title" data-slot="title"></div>
            <div class="summary-kinds" data-slot="kinds"></div>
          </div>
        </div>
        <ul class="cards" data-slot="cards"></ul>
      </section>
    </template>

    <template id="tpl-card">
      <li class="card">
        <span class="card-badge" data-slot="badge" aria-hidden="true"></span>
        <div class="card-body">
          <div class="card-head">
            <strong class="card-name" data-slot="name"></strong>
            <span class="chip" data-slot="kind"></span>
          </div>
          <div class="card-cat" data-slot="category"></div>
          <code class="card-header mono" data-slot="header"></code>
        </div>
      </li>
    </template>

    <template id="tpl-empty">
      <section class="state">
        <div class="state-icon icon-muted" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M16 16l4.5 4.5M8.5 11h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </div>
        <h1 class="state-title">No known signature</h1>
        <p class="state-text">
          None of the headers match a known WAF or CDN. That doesn't mean the site is
          unprotected. Many WAFs hide or strip their headers.
        </p>
      </section>
    </template>

    <template id="tpl-error">
      <section class="state">
        <div class="state-icon icon-warn" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26">
            <path d="M12 4 L21 19.5 H3 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            <path d="M12 10v4.5M12 17.2v.1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        </div>
        <h1 class="state-title" data-slot="title"></h1>
        <p class="state-text" data-slot="text"></p>
        <button class="secondary-btn" type="button" data-action="retry" hidden>Try again</button>
      </section>
    </template>

    <script src="popup.js"></script>
  </body>
</html>
